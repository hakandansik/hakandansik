<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervasyon Düzenle</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Rezervasyon Düzenle</h2>
        <form method="POST">
            <div class="form-group">
                <label for="ad">Ad</label>
                <input type="text" class="form-control" id="ad" name="ad" value="{{ rezervasyon['AD'] }}" required>
            </div>
            <div class="form-group">
                <label for="gsm">Telefon</label>
                <input type="text" class="form-control" id="gsm" name="gsm" value="{{ rezervasyon['GSM'] }}" required>
            </div>
            <div class="form-group">
                <label for="tc_pasaport">TC/Pasaport No</label>
                <input type="text" class="form-control" id="tc_pasaport" name="tc_pasaport" value="{{ rezervasyon['TC_PASAPORT'] }}" required>
            </div>
            <div class="form-group">
                <label for="dogum_tarihi">Doğum Tarihi</label>
                <input type="text" class="form-control" id="dogum_tarihi" name="dogum_tarihi" value="{{ rezervasyon['DOGUM_TARIHI'] }}" required>
            </div>
            <div class="form-group">
                <label for="sertifika">Sertifika</label>
                <input type="text" class="form-control" id="sertifika" name="sertifika" value="{{ rezervasyon['SERTIFIKA'] }}" required>
            </div>
            <div class="form-group">
                <label for="tarih">Rezervasyon Tarihi</label>
                <input type="text" class="form-control" id="tarih" name="tarih" value="{{ rezervasyon['TARIH'] }}" required>
            </div>
            <!-- E-Posta Alanı -->
            <div class="form-group">
                <label for="email">E-Posta</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ rezervasyon['EMAIL'] }}" required>
            </div>
            <button type="submit" class="btn btn-success">Kaydet</button>
            <a href="{{ url_for('rezervasyon_list') }}" class="btn btn-secondary">İptal</a>
        </form>
    </div>
</body>
</html>
