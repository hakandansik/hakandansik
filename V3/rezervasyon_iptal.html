<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervasyon İptali Onayı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        .modal-content {
            padding: 20px;
        }
        .image-container {
            margin-top: 50px; /* Resim için boşluk */
            text-align: center; /* Resmi ortalar */
        }
        .image-container img {
            max-width: 100%; /* Resmi boyutlandırır */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="modal-content">
            <!-- Başarı veya Hata Mesajı -->
            {% if mesaj %}
                <h4 class="text-center text-success">{{ mesaj }}</h4>
                <!-- Resmi Eklemek İçin Alan -->
                <div class="image-container">
                    <img src="{{ url_for('static', filename='6.jpg') }}" alt="Rezervasyon İptal Resmi">
                </div>
            {% else %}
                <h4 class="text-center">Rezervasyonu İptal Etmek İstediğinize Emin misiniz?</h4>
                <p class="text-center">Bu işlem geri alınamaz. Rezervasyonunuzu iptal etmek için "Evet" butonuna tıklayın.</p>

                <div class="d-flex justify-content-center mt-4">
                    <!-- İptal Onay Formu (Token ile çalışacak şekilde güncellendi) -->
                    <form action="{{ url_for('rezervasyon_iptal_et', token=iptal_token) }}" method="POST" style="margin-right: 10px;">
                        <button type="submit" class="btn btn-danger">Evet, İptal Et</button>
                    </form>

                    <!-- Vazgeç Butonu -->
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Hayır, Vazgeç</a>
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
