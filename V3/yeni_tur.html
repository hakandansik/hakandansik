<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Tur Tanımlama</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="bg-light py-4">
<div class="container">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Yeni Tur Tanımlama</h4>
        </div>
        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/yeni_tur">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="tur_ismi" class="form-label">Tur İsmi</label>
                    <input type="text" class="form-control" id="tur_ismi" name="tur_ismi" value="{{ form_data.get('tur_ismi', '') }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="baslangic_tarihi" class="form-label">Başlangıç Tarihi</label>
                        <input type="text" class="form-control datepicker" id="baslangic_tarihi" name="baslangic_tarihi" value="{{ form_data.get('baslangic_tarihi', '') }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="bitis_tarihi" class="form-label">Bitiş Tarihi</label>
                        <input type="text" class="form-control datepicker" id="bitis_tarihi" name="bitis_tarihi" value="{{ form_data.get('bitis_tarihi', '') }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="kontenjan" class="form-label">Tur Kontenjanı</label>
                    <input type="number" class="form-control" id="kontenjan" name="kontenjan" value="{{ form_data.get('kontenjan', '') }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="fiyat" class="form-label">Tur Fiyati</label>
                    <input type="number" class="form-control" id="fiyat" name="fiyat" value="{{ form_data.get('fiyat', '') }}" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('tur_list') }}" class="btn btn-secondary">Geri</a>
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    flatpickr(".datepicker", {
        dateFormat: "d/m/Y"
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
