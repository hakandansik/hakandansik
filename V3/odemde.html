<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Sayfası</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">Ödeme Bilgileri</h2>
    <form action="/odeme_onayla" method="POST" class="card p-4 shadow-sm bg-white">
        <input type="hidden" name="adsoyad" value="{{ adsoyad }}">
        <input type="hidden" name="telefon" value="{{ telefon }}">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="tc_pasaport" value="{{ tc_pasaport }}">
        <input type="hidden" name="dogum_tarihi" value="{{ dogum_tarihi }}">
        <input type="hidden" name="adres" value="{{ adres }}">
        <input type="hidden" name="sertifika" value="{{ sertifika }}">
        <input type="hidden" name="tur_id" value="{{ tur._id }}">
        <input type="hidden" name="tarih" value="{{ tur.BASLANGIC_TARIHI.strftime('%d/%m/%Y') if tur else '' }}">

        <div class="mb-3">
            <label class="form-label">Tutar</label>
            <p class="form-control bg-light">{{ tur.FIYAT if tur else 'Bilinmiyor' }} TL</p>
        </div>

        <div class="mb-3">
            <label class="form-label">Kart Numarası</label>
            <input type="text" name="kart_no" class="form-control" required placeholder="1234 5678 9012 3456">
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Son Kullanma Tarihi</label>
                <input type="text" name="son_kullanma" class="form-control" required placeholder="MM/YY">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CVV</label>
                <input type="text" name="cvv" class="form-control" required placeholder="123">
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Ödemeyi Tamamla</button>
    </form>
</div>
</body>
</html>
